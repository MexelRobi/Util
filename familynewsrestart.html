<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Restarting...</title>
    <script>
        // 1. Den Deep Link an deine App senden
        window.location.href = 'familynews://restart';
        
        // 2. Kurz warten (300ms), damit iOS Zeit hat, die App zu wechseln
        setTimeout(function() {
            // 💡 DER TRICK: Wir gaukeln Safari vor, die Seite hätte sich selbst geöffnet
            window.open('', '_self', '');
            
            // Jetzt erlaubt Safari das Schliessen des Tabs!
            window.close();
        }, 300);
    </script>
</head>
<body style="background-color: #f2f2f7; font-family: -apple-system; text-align: center; margin-top: 100px;">
    <h2>Restarting App...</h2>
    <p>This tab will close automatically.</p>
</body>
</html>
