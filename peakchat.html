<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakChat</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#18181b] text-[#f4f4f5] h-screen flex flex-col font-sans">

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="fixed inset-0 bg-[#09090b] z-50 flex items-center justify-center hidden">
        <div class="bg-[#27272a] p-6 rounded-lg border border-[#3f3f46] w-80 shadow-xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-4">PeakChat Setup</h2>
            <input type="text" id="setup-username" placeholder="Display Name" class="w-full bg-[#18181b] border border-[#52525b] rounded p-2 text-sm mb-3 focus:outline-none">
            <input type="password" id="setup-key" placeholder="Access Key" class="w-full bg-[#18181b] border border-[#52525b] rounded p-2 text-sm mb-4 focus:outline-none">
            <button onclick="saveSetup()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded text-sm font-semibold cursor-pointer">Connect</button>
        </div>
    </div>

    <!-- UTILITY TOP BAR -->
    <div class="bg-[#27272a] px-4 py-2 border-b border-[#3f3f46] flex items-center justify-between text-xs">
        <span class="font-bold text-emerald-400 text-sm">PeakChat</span>
        <div class="flex items-center space-x-2">
            <input type="text" id="panic-url" value="https://wikipedia.org" class="bg-[#18181b] border border-[#52525b] rounded px-2 py-1 w-40 text-[#f4f4f5] focus:outline-none">
            <button onclick="triggerLocalPanic()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded font-bold cursor-pointer">PANIC (ESC)</button>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        
        <!-- INPUT FRAME -->
        <div class="p-3 bg-[#27272a] border-t border-[#3f3f46] flex gap-2">
            <input type="text" id="message-input" placeholder="Message..." class="flex-1 bg-[#18181b] border border-[#52525b] rounded px-3 py-2 text-sm focus:outline-none">
            <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded text-sm font-semibold cursor-pointer">Send</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "DEINE_SUPABASE_PROJECT_URL";
        const SUPABASE_ANON_KEY = "DEIN_SUPABASE_ANON_KEY";
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = "";

        window.addEventListener('DOMContentLoaded', () => {
            currentUser = localStorage.getItem('peak_chat_user');
            if (!currentUser || !localStorage.getItem('peak_chat_key')) {
                document.getElementById('setup-screen').classList.remove('hidden');
            } else { initChat(); }
        });

        function saveSetup() {
            const user = document.getElementById('setup-username').value.trim();
            const key = document.getElementById('setup-key').value.trim();
            if (user && key) {
                localStorage.setItem('peak_chat_user', user);
                localStorage.setItem('peak_chat_key', key);
                currentUser = user;
                document.getElementById('setup-screen').classList.add('hidden');
                initChat();
            }
        }

        function initChat() {
            loadHistory();
            supabase.channel('room1').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, 
                payload => { renderMessage(payload.new); }
            ).subscribe();
        }

        async function loadHistory() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
            if (data) data.forEach(renderMessage);
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await supabase.from('messages').insert([{ user: currentUser, text }]);
        }

        function renderMessage(msg) {
            const container = document.getElementById('message-container');
            const html = `
                <div class="text-sm bg-[#27272a]/40 p-2 rounded max-w-2xl">
                    <div class="flex items-baseline space-x-2 mb-0.5">
                        <span class="font-bold text-emerald-400 text-xs">${msg.user}</span>
                        <span class="text-[10px] text-[#a1a1aa]">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <p class="text-[#f4f4f5] text-[13px] break-words">${msg.text}</p>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('message-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        function triggerLocalPanic() { window.location.href = document.getElementById('panic-url').value.trim() || 'https://google.com'; }
        window.addEventListener('keydown', e => { if (e.key === 'Escape') triggerLocalPanic(); });
    </script>
</body>
</html>
