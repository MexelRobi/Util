
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b141a">
  <title>PeakChat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b141a;
      --panel: #111b21;
      --surface: #1b282f;
      --line: rgba(255,255,255,.065);
      --green: #00a884;
      --muted: #8696a0;
      --text: #e9edef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      letter-spacing: -.015em;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    header {
      position: relative;
      z-index: 10;
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #737d76;
      box-shadow: 0 0 0 3px rgba(255,255,255,.035);
      transition: background .25s, box-shadow .25s;
    }

    .dot.online {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(0,168,132,.12);
    }

    /* Pinned messages overlay */

    .pinned-bar {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 7px;

      width: min(65%, 750px);
      max-width: 750px;
      min-height: 0;

      padding: 7px 10px;

      overflow-x: auto;
      overflow-y: hidden;

      background: #152128;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 10px 10px;

      scrollbar-width: thin;
      scrollbar-color: #34434b transparent;

      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }

    .pinned-bar:empty {
      display: none;
    }

    .pinned-label {
      flex-shrink: 0;
      padding-right: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .pinned-item {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;

      max-width: 250px;
      padding: 6px 10px;

      border: 1px solid rgba(0,168,132,.2);
      border-radius: 7px;

      background: rgba(0,168,132,.08);
      color: var(--text);

      text-align: left;
      transition: background .2s, border-color .2s;
    }

    .pinned-item:hover {
      background: rgba(0,168,132,.17);
      border-color: rgba(0,168,132,.5);
    }

    .pinned-icon {
      color: var(--green);
      font-size: 12px;
      flex-shrink: 0;
    }

    .pinned-text {
      min-width: 0;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Workspace */

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-head {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 26px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .chat-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    /* Messages */

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 6%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #34434b transparent;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #34434b;
      border-radius: 10px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .welcome {
      margin: auto;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    /* Date sections */

    .date-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 10px;
      animation: date-in .3s ease both;
    }

    .date-separator::before,
    .date-separator::after {
      content: "";
      height: 1px;
      flex: 1;
      max-width: 100px;
      background: var(--line);
    }

    .date-separator span {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #172229;
      color: #aebac1;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    @keyframes date-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: min(78%, 760px);
      animation: message-in .22s cubic-bezier(.2,.8,.2,1) both;
      transform-origin: bottom;
    }

    .message a {
      color: #53bdeb;
      text-decoration: underline;
      cursor: pointer;
      word-break: break-all;
    }

    .message a:hover {
      color: #8bd7fa;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message-content {
      min-width: 0;
      max-width: 100%;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 5px 2px;
    }

    .author {
      color: #53bdeb;
      font-size: 10px;
      font-weight: 600;
    }

    .time {
      color: var(--muted);
      font-size: 9px;
      opacity: .7;
    }

    .message-text {
      display: inline-block;
      max-width: 100%;
      padding: 10px 13px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 3px 12px 12px 12px;
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .message.outgoing {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.outgoing .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message.outgoing .meta {
      justify-content: flex-end;
    }

    .message.outgoing .author {
      display: none;
    }

    .message.outgoing .message-text {
      background: #075e4e;
      border-radius: 12px 3px 12px 12px;
    }

    .message.pinned-highlight .message-text {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,168,132,.14);
    }

    /* Composer */

    .composer {
      padding: 15px max(22px, 6%) 18px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    .hstack {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      padding: 5px 7px;
      background: #172229;
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .input-wrap:focus-within {
      border-color: rgba(0,168,132,.55);
      background: #19272e;
      box-shadow: 0 0 0 3px rgba(0,168,132,.08);
    }

    /* Panic */

    .panic-button {
      width: 52px;
      height: 36px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: #d92d3a;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    .panic-button:hover {
      background: #f04452;
      transform: translateY(-1px);
      box-shadow: 0 3px 12px rgba(217,45,58,.25);
    }

    .panic-button:active {
      transform: scale(.94);
    }

    .panic-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #message-input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
    }

    #message-input::placeholder {
      color: var(--muted);
    }

    .send {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border: 0;
      border-radius: 50%;
      background: var(--green);
      color: #062d25;
      font-size: 0;
      transition: transform .18s, background .18s, box-shadow .18s;
    }

    .send::after {
      content: "➤";
      font-size: 15px;
    }

    .send:hover {
      background: #06cf9c;
      transform: scale(1.06);
      box-shadow: 0 3px 12px rgba(0,168,132,.2);
    }

    .send:active {
      transform: scale(.93);
    }

    .send:disabled {
      opacity: .5;
      cursor: wait;
    }

    /* Setup */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(5px);
    }

    .modal.hidden {
      display: none;
    }

    .setup {
      width: 100%;
      max-width: 350px;
      padding: 27px;
      background: #152128;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      animation: setup-in .3s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes setup-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .setup h2 {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.045em;
    }

    .field-label {
      display: block;
      margin: 13px 0 6px;
      color: #d1d7db;
      font-size: 11px;
      font-weight: 550;
    }

    .field {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      resize: vertical;
      transition: border-color .2s, box-shadow .2s;
    }

    .field:focus {
      border-color: rgba(0,168,132,.7);
      box-shadow: 0 0 0 3px rgba(0,168,132,.08);
    }

    .connect {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #062d25;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      transition: transform .18s, background .18s;
    }

    .connect:hover {
      background: #06cf9c;
      transform: translateY(-1px);
    }

    .connect:active {
      transform: scale(.98);
    }

    .connect:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* Toast */

    .toast {
      position: fixed;
      z-index: 30;
      right: 22px;
      bottom: 22px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 11px;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .25s, transform .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile */

    @media (max-width: 720px) {
      header {
        height: 54px;
        padding: 0 15px;
        gap: 8px;
      }

      .brand {
        gap: 8px;
      }

      .brand-name {
        font-size: 14px;
      }

      .pinned-bar {
        width: 75%;
        max-width: none;
      }

      .pinned-item {
        max-width: 180px;
      }

      .chat-head {
        padding: 0 15px;
      }

      .messages {
        padding: 16px;
      }

      .message {
        max-width: 92%;
      }

      .composer {
        padding: 10px 12px 12px;
      }

      .connection {
        font-size: 10px;
        gap: 7px;
      }

      .setup {
        padding: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-name">PeakChat</div>
      </div>

      <!-- Pinned messages -->
      <div id="pinned-bar" class="pinned-bar"></div>

      <div class="connection">
        <span id="status-dot" class="dot"></span>
        <span id="connection-text">Offline</span>
      </div>
    </header>

    <main class="workspace">
      <section class="chat">
        <div class="chat-head">
          <div class="chat-title">General</div>
        </div>

        <div id="message-container" class="messages">
          <div id="welcome" class="welcome">
            <p>No messages yet</p>
          </div>
        </div>

        <div class="composer">
          <div class="hstack">
            <button
              id="panic-button"
              class="panic-button"
              type="button"
              onclick="sendPanicMessage()"
              aria-label="Lock PeakChat"
              title="Lock PeakChat"
            >PANIC</button>

            <div class="input-wrap">
              <input
                id="message-input"
                maxlength="2000"
                placeholder="Message"
                autocomplete="off"
              >

              <button
                id="send-button"
                class="send"
                onclick="sendMessage()"
                aria-label="Send message"
              >Send</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Setup -->
  <div id="setup-screen" class="modal hidden">
    <div class="setup">
      <h2>PeakChat</h2>

      <label class="field-label" for="setup-username">Name</label>
      <input
        id="setup-username"
        class="field"
        type="text"
        maxlength="32"
        placeholder="Your name"
        autocomplete="nickname"
      >

      <label class="field-label" for="setup-key">Key</label>
      <textarea
        id="setup-key"
        class="field"
        rows="2"
        placeholder="Paste key"
        autocomplete="off"
        spellcheck="false"
      ></textarea>

      <button
        id="connect-button"
        class="connect"
        onclick="saveSetup()"
      >Connect</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = "https://bgdosmqrxhkcgerqamku.supabase.co";

    let db = null;
    let currentUser = "";
    let channel = null;
    let toastTimer = null;
    let lastRenderedDate = null;
    let panicLocked = false;

    const seen = new Set();
    const pinnedMessages = new Map();

    const $ = id => document.getElementById(id);

    /* Panic lock */

    function triggerPanicLock() {
      if (panicLocked) return;

      panicLocked = true;

      document.documentElement.innerHTML = "";
      document.documentElement.style.cssText =
        "background:#fff!important;min-height:100%;";
    }

    async function hasPanicMessage() {
      if (!db) return false;

      const { data, error } = await db
        .from("messages")
        .select("id")
        .ilike("text", "%//panic/%")
        .limit(1);

      if (error) throw error;

      return Array.isArray(data) && data.length > 0;
    }

    /* Startup */

    window.addEventListener("DOMContentLoaded", () => {
      currentUser = localStorage.getItem("peak_chat_user") || "";
      const key = localStorage.getItem("peak_chat_anon_key") || "";

      if (!currentUser || !key) {
        $("setup-screen").classList.remove("hidden");
      } else {
        initSupabase(key);
      }
    });

    async function saveSetup() {
      const user = $("setup-username").value.trim();
      const key = $("setup-key").value.trim();

      if (!user || !key) {
        return showToast("Enter your name and key.");
      }

      if (user.length > 32) {
        return showToast("Display name is too long.");
      }

      $("connect-button").disabled = true;
      $("connect-button").textContent = "Connecting...";

      currentUser = user;

      try {
        const success = await initSupabase(key);

        if (success && db) {
          localStorage.setItem("peak_chat_user", user);
          localStorage.setItem("peak_chat_anon_key", key);
          $("setup-screen").classList.add("hidden");
        }
      } finally {
        $("connect-button").disabled = false;
        $("connect-button").textContent = "Connect";
      }
    }

    /* Supabase */

    async function initSupabase(key) {
      setConnection(false, "Connecting");

      try {
        if (
          !window.supabase ||
          typeof window.supabase.createClient !== "function"
        ) {
          throw new Error(
            "Supabase SDK did not load. Check your internet connection."
          );
        }

        db = window.supabase.createClient(SUPABASE_URL, key, {
          auth: {
            persistSession: false,
            autoRefreshToken: false
          }
        });

        const check = await Promise.race([
          db.from("messages").select("id").limit(1),
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("Supabase request timed out.")),
              10000
            )
          )
        ]);

        if (check.error) throw check.error;

        if (await hasPanicMessage()) {
          triggerPanicLock();
          return true;
        }

        // Load chat history and pinned messages.
        await loadHistory();
        await loadPinnedMessages();

        if (channel) {
          await db.removeChannel(channel);
        }

        channel = db
          .channel("peakchat-room")
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "messages"
            },
            payload => {
              const msg = payload.new;

              if (
                payload.eventType !== "DELETE" &&
                String(msg?.text ?? "").includes("//panic/")
              ) {
                triggerPanicLock();
                return;
              }

              if (payload.eventType === "INSERT") {
                renderMessage(msg);
                updatePinnedMessage(msg);
              }

              if (payload.eventType === "UPDATE") {
                updatePinnedMessage(msg);
              }

              if (payload.eventType === "DELETE") {
                const oldId = payload.old?.id;

                pinnedMessages.delete(oldId);
                renderPinnedMessages();

                const element = document.getElementById(
                  `message-${oldId}`
                );

                element?.remove();
                seen.delete(oldId);
              }
            }
          )
          .subscribe(async status => {
            if (status === "SUBSCRIBED") {
              try {
                if (await hasPanicMessage()) {
                  triggerPanicLock();
                  return;
                }
              } catch (err) {
                console.error("[PeakChat panic check]", err);
              }

              setConnection(true, "Online");

            } else if (
              status === "CHANNEL_ERROR" ||
              status === "TIMED_OUT"
            ) {
              setConnection(false, "Connection error");

            } else if (status === "CLOSED") {
              setConnection(false, "Offline");
            }
          });

        return true;

      } catch (err) {
        console.error("[PeakChat]", err);

        db = null;

        setConnection(false, "Connection failed");
        showToast(err.message || "Could not connect to Supabase.");

        $("setup-screen").classList.remove("hidden");

        return false;
      }
    }

    function setConnection(online, label) {
      $("status-dot").classList.toggle("online", online);
      $("connection-text").textContent = label;
    }

    /* History */

    async function loadHistory() {
      const { data, error } = await db
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(100);

      if (error) throw error;

      (data || []).forEach(renderMessage);
    }

    /* Pinned messages */

    async function loadPinnedMessages() {
      const { data, error } = await db
        .from("messages")
        .select("*")
        .eq("pinned", true)
        .order("created_at", { ascending: true });

      if (error) throw error;

      pinnedMessages.clear();

      (data || []).forEach(msg => {
        pinnedMessages.set(msg.id, msg);
      });

      renderPinnedMessages();
    }

    function updatePinnedMessage(msg) {
      if (!msg || !msg.id) return;

      if (msg.pinned === true) {
        pinnedMessages.set(msg.id, msg);
      } else {
        pinnedMessages.delete(msg.id);
      }

      renderPinnedMessages();
    }

    function renderPinnedMessages() {
      const bar = $("pinned-bar");

      bar.replaceChildren();

      if (pinnedMessages.size === 0) return;

      const label = document.createElement("span");
      label.className = "pinned-label";
      label.textContent = "PINNED";

      bar.appendChild(label);

      for (const msg of pinnedMessages.values()) {
        const item = document.createElement("button");

        item.type = "button";
        item.className = "pinned-item";
        item.title = "Jump to pinned message";

        const icon = document.createElement("span");
        icon.className = "pinned-icon";
        icon.textContent = "◆";

        const text = document.createElement("span");
        text.className = "pinned-text";
        text.textContent =
          `${msg.user || "Unknown"}: ${msg.text || ""}`;

        item.append(icon, text);

        item.addEventListener("click", () => {
          jumpToMessage(msg.id);
        });

        bar.appendChild(item);
      }
    }

    async function jumpToMessage(id) {
      let element = document.getElementById(`message-${id}`);

      // Fetch the original message if it is outside the loaded history.
      if (!element) {
        const { data, error } = await db
          .from("messages")
          .select("*")
          .eq("id", id)
          .maybeSingle();

        if (error || !data) {
          showToast("Could not load pinned message.");
          return;
        }

        renderMessage(data);
        element = document.getElementById(`message-${id}`);
      }

      if (!element) return;

      element.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      element.classList.add("pinned-highlight");

      setTimeout(() => {
        element.classList.remove("pinned-highlight");
      }, 2000);
    }

    /* Message links */

    function renderMessageText(element, text) {
      const regex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
      let lastIndex = 0;

      for (const match of text.matchAll(regex)) {
        const url = match[0];
        const index = match.index;

        element.appendChild(
          document.createTextNode(text.slice(lastIndex, index))
        );

        const link = document.createElement("a");

        const hyperlink = url.startsWith("http")
          ? url
          : "https://" + url;

        link.href = hyperlink;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = url;

        element.appendChild(link);

        lastIndex = index + url.length;
      }

      element.appendChild(
        document.createTextNode(text.slice(lastIndex))
      );
    }

    /* Render messages */

    function renderMessage(msg) {
      if (!msg || panicLocked) return;

      if (String(msg.text ?? "").includes("//panic/")) {
        triggerPanicLock();
        return;
      }

      const identity =
        msg.id ?? [msg.user, msg.created_at, msg.text].join("|");

      if (seen.has(identity)) return;

      const date = new Date(msg.created_at);

      if (Number.isNaN(date.getTime())) {
        console.warn("[PeakChat] Invalid message date:", msg.created_at);
        return;
      }

      seen.add(identity);

      const container = $("message-container");

      $("welcome")?.remove();

      const dateKey = getDateKey(date);

      if (dateKey !== lastRenderedDate) {
        const separator = document.createElement("div");

        separator.className = "date-separator";

        const label = document.createElement("span");
        label.textContent = getDateLabel(date);

        separator.appendChild(label);
        container.appendChild(separator);

        lastRenderedDate = dateKey;
      }

      const row = document.createElement("div");

      if (msg.id) {
        row.id = `message-${msg.id}`;
      }

      row.className =
        "message" +
        (String(msg.user || "") === currentUser ? " outgoing" : "");

      const content = document.createElement("div");
      content.className = "message-content";

      const meta = document.createElement("div");
      meta.className = "meta";

      const author = document.createElement("span");
      author.className = "author";
      author.textContent = msg.user || "Unknown";

      const time = document.createElement("span");
      time.className = "time";

      time.textContent = date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      const body = document.createElement("div");
      body.className = "message-text";

      renderMessageText(body, String(msg.text ?? ""));

      meta.append(author, time);
      content.append(meta, body);
      row.append(content);

      container.append(row);

      container.scrollTop = container.scrollHeight;
    }

    /* Send messages */

    async function sendPanicMessage() {
      const button = $("panic-button");

      if (!db) {
        return showToast("Not connected to Supabase yet.");
      }

      if (panicLocked || button.disabled) return;

      button.disabled = true;

      try {
        const { error } = await db
          .from("messages")
          .insert([
            {
              user: currentUser,
              text: "//panic/"
            }
          ]);

        if (error) throw error;

        triggerPanicLock();

      } catch (err) {
        console.error("[PeakChat panic button]", err);

        showToast(err.message || "Could not lock PeakChat.");

        button.disabled = false;
      }
    }

    async function sendMessage() {
      const input = $("message-input");
      const text = input.value.trim();
      const button = $("send-button");

      if (!text) return;

      if (!db) {
        return showToast("Not connected to Supabase yet.");
      }

      button.disabled = true;

      try {
        const { error } = await db
          .from("messages")
          .insert([
            {
              user: currentUser,
              text
            }
          ]);

        if (error) throw error;

        input.value = "";
        input.focus();

        if (text.includes("//panic/")) {
          triggerPanicLock();
          return;
        }

      } catch (err) {
        console.error("[PeakChat send]", err);

        showToast(err.message || "Message could not be sent.");

      } finally {
        button.disabled = false;
      }
    }

    /* Date helpers */

    function getDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function getDateLabel(date) {
      const now = new Date();

      const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      const messageDay = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );

      const difference = Math.round(
        (today - messageDay) / 86400000
      );

      if (difference === 0) return "Today";
      if (difference === 1) return "Yesterday";

      return new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: date.getFullYear() !== now.getFullYear()
          ? "numeric"
          : undefined
      }).format(date);
    }

    /* Toast */

    function showToast(message) {
      const toast = $("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(
        () => toast.classList.remove("show"),
        3500
      );
    }

    /* Keyboard */

    $("message-input").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
