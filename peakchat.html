<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peakgruppe Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #efeae2; display: flex; justify-content: center; align-items: center; height: 100vh; color: #111b21; }
    #login-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 380px; width: 90%; text-align: center; }
    h2 { color: #008069; margin-bottom: 8px; font-size: 24px; }
    p { color: #667781; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #e1e7ea; border-radius: 8px; font-size: 15px; background: #f8f9fa; outline: none; transition: 0.2s; }
    input:focus { border-color: #008069; background: white; }
    button { width: 100%; padding: 12px; background: #008069; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #006653; }
    button:disabled { background: #a6c9c2; cursor: not-allowed; }
    #chat-box { display: none; flex-direction: column; width: 100%; height: 100vh; max-width: 650px; background: #efeae2; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    #chat-header { background: #008069; color: white; padding: 14px 20px; font-weight: 600; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    #status-dot { width: 8px; height: 8px; background: #1fa344; border-radius: 50%; display: inline-block; margin-right: 6px; }
    #messages { flex-grow: 1; overflow-y: auto; padding: 20px; background-image: url('https://githubusercontent.com'); background-repeat: repeat; }
    .msg-wrapper { display: flex; width: 100%; margin-bottom: 8px; }
    .msg-wrapper.me { justify-content: flex-end; }
    .msg { padding: 8px 12px; border-radius: 8px; background: white; max-width: 75%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 15px; display: flex; flex-direction: column; }
    .msg-wrapper.me .msg { background: #d9fdd3; }
    .msg .user { font-size: 12px; font-weight: 600; color: #53bdeb; margin-bottom: 2px; }
    .msg-wrapper.me .msg .user { color: #008069; }
    .msg .text { word-break: break-word; line-height: 1.4; }
    .msg .time { font-size: 10px; color: #667781; align-self: flex-end; margin-top: 4px; margin-left: 20px; }
    #input-area { display: flex; gap: 10px; padding: 10px 16px; background: #f0f2f5; align-items: center; }
    #input-area input { margin: 0; background: white; border-radius: 20px; padding: 12px 20px; }
    #input-area button { width: auto; border-radius: 50%; width: 45px; height: 45px; padding: 0; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-box">
    <h2>Peakgruppe</h2>
    <p>Sichere GitHub-Pages Verbindung</p>
    <input type="text" id="username" placeholder="Dein Name" />
    <input type="password" id="key" placeholder="Zugriffsschlüssel (API Key)" />
    <button onclick="login()" id="login-btn">Eintreten</button>
  </div>

  <!-- CHAT WINDOW -->
  <div id="chat-box">
    <div id="chat-header">
      <div><span id="status-dot"></span> Peakgruppe Chat</div>
      <div style="font-size: 12px; opacity: 0.8;" id="active-user"></div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-text" placeholder="Nachricht schreiben..." onkeypress="if(event.key==='Enter') send()" disabled />
      <button onclick="send()" id="send-btn" disabled>➔</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzp5fCzLA91VeM5mtc9DbWDWLnDtsTY5oSViGb1uxpZlkTB_VEMM7U1Fl0VCdm45zgf/exec";

    let userKey = "";
    let myName = "";
    let lastLoadedJson = ""; 

    // PRÜFUNG BEIM LADEN DER SEITE (Automatischer Login)
    window.onload = async function() {
      const savedKey = localStorage.getItem("pg_user_key");
      const savedName = localStorage.getItem("pg_user_name");

      if (savedKey && savedName) {
        userKey = savedKey;
        myName = savedName;
        
        // Benutzeroberfläche direkt umschalten
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        document.getElementById('active-user').innerText = myName;
        document.getElementById('msg-text').disabled = false;
        document.getElementById('send-btn').disabled = false;
        
        // Direkt Nachrichten laden und Intervall starten
        try {
          const messages = await callApi({ action: "getMessages", key: userKey });
          renderMessages(messages);
          setInterval(loadMessagesSilently, 4000);
        } catch (err) {
          // Falls gespeicherter Key serverseitig ungültig ist, lokal löschen und Login zeigen
          localStorage.clear();
          window.location.reload();
        }
      }
    };

    async function callApi(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (result.status === "error") throw new Error(result.message);
      return result.data;
    }

    async function login() {
      const inputName = document.getElementById('username').value.trim();
      const inputKey = document.getElementById('key').value.trim();
      
      if (!inputKey || !inputName) return alert("Bitte Name und Key eingeben!");
      document.getElementById('login-btn').disabled = true;
      
      try {
        // Validierungs-Abruf gegen die Google API
        const messages = await callApi({ action: "getMessages", key: inputKey });
        
        // DATEN PERSISTENT SPEICHERN
        localStorage.setItem("pg_user_key", inputKey);
        localStorage.setItem("pg_user_name", inputName);
        
        userKey = inputKey;
        myName = inputName;
        
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        document.getElementById('active-user').innerText = myName;
        document.getElementById('msg-text').disabled = false;
        document.getElementById('send-btn').disabled = false;
        
        renderMessages(messages);
        setInterval(loadMessagesSilently, 4000); 
      } catch (err) {
        alert("Login fehlgeschlagen: " + err.message);
        document.getElementById('login-btn').disabled = false;
      }
    }

    async function loadMessagesSilently() {
      try {
        const messages = await callApi({ action: "getMessages", key: userKey });
        renderMessages(messages);
      } catch (err) {
        console.warn("Hintergrund-Sync ausgesetzt: ", err.message);
      }
    }

    function renderMessages(messages) {
      const currentJson = JSON.stringify(messages);
      if (currentJson === lastLoadedJson) return;
      lastLoadedJson = currentJson;

      const box = document.getElementById('messages');
      const atBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 100;
      
      box.innerHTML = "";
      messages.forEach(m => {
        const isMe = m.user.toLowerCase() === myName.toLowerCase();
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'me' : ''}`;
        wrapper.innerHTML = `
          <div class="msg">
            <div class="user">${m.user}</div>
            <div class="text">${escapeHtml(m.text)}</div>
            <div class="time">${m.time || ''}</div>
          </div>
        `;
        box.appendChild(wrapper);
      });
      
      if (atBottom || box.scrollTop === 0) box.scrollTop = box.scrollHeight;
    }

    async function send() {
      const input = document.getElementById('msg-text');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;
      
      input.disabled = true;
      btn.disabled = true;
      
      try {
        await callApi({ action: "sendMessage", key: userKey, username: myName, text: text });
        input.value = "";
        input.disabled = false;
        btn.disabled = false;
        input.focus();
        loadMessagesSilently();
      } catch (err) {
        alert("Fehler beim Senden: " + err.message);
        input.disabled = false;
        btn.disabled = false;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
